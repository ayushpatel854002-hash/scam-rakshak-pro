name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Regenerate Fresh Android Folder & Enable Desugaring
        run: |
          rm -rf android
          flutter create . --platforms=android
          sed -i 's/sourceCompatibility = JavaVersion.VERSION_17/isCoreLibraryDesugaringEnabled = true\n        sourceCompatibility = JavaVersion.VERSION_17/g' android/app/build.gradle.kts
          sed -i 's/sourceCompatibility = JavaVersion.VERSION_11/isCoreLibraryDesugaringEnabled = true\n        sourceCompatibility = JavaVersion.VERSION_17/g' android/app/build.gradle.kts
          sed -i 's/targetCompatibility = JavaVersion.VERSION_11/targetCompatibility = JavaVersion.VERSION_17/g' android/app/build.gradle.kts
          cat << 'EOF' >> android/app/build.gradle.kts

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
          }
          EOF
      - run: flutter pub get
      - name: Fix Plugin JVM Compatibility
        run: |
          cat << 'EOF' >> android/build.gradle.kts
          subprojects {
              plugins.withId("com.android.library") {
                  extensions.configure<com.android.build.gradle.LibraryExtension> {
                      compileOptions {
                          sourceCompatibility = JavaVersion.VERSION_17
                          targetCompatibility = JavaVersion.VERSION_17
                      }
                  }
              }
              tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
                  compilerOptions {
                      jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
                  }
              }
          }
          EOF
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Scam-Rakshak-Pro-APK
          path: build/app/outputs/flutter-apk/app-release.apk
